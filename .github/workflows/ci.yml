name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# No `env:` block. It used to set DATABASE_URL and PHOS_LOG_LEVEL,
# because config was read at module load and the build failed without
# them. PHOS has no server, no database URL and no runtime configuration
# to supply — a build needs nothing but the source.
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check Formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (engines and repositories — Vitest)
        run: npm run test

      - name: Test (frontend — Jest)
        run: npm run test:ui

      - name: Build
        run: npm run build
