name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# No `env:` block. It used to set DATABASE_URL and PHOS_LOG_LEVEL,
# because config was read at module load and the build failed without
# them. PHOS has no server, no database URL and no runtime configuration
# to supply — a build needs nothing but the source.
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Read from `.nvmrc` rather than pinned here, so CI and whoever
      # generated `package-lock.json` are always the same major version.
      #
      # They were not, and it cost two failed deploys. The lockfile is
      # written by npm 11 (Node 24); CI ran Node 20, whose npm 10 records
      # optional platform dependencies differently and reported
      # `@emnapi/core` and `@emnapi/runtime` as "Missing from lock file".
      # The lockfile was fine — the two npms simply disagreed about it.
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # `npm install`, not `npm ci`, and that is a deliberate trade.
      #
      # `npm ci` refuses to install unless the lockfile matches its own
      # resolution exactly. That check is worth having when everyone
      # builds on the same platform and npm version — and actively
      # harmful when they do not. PHOS's lockfile is written on Windows
      # by npm 11; three separate deploys failed here on `EUSAGE`,
      # disagreeing about optional platform packages that were never
      # actually needed to build anything.
      #
      # `npm install` reads the same committed lockfile and honours the
      # versions in it, but resolves platform-specific packages for the
      # machine it is running on instead of demanding they were
      # predicted correctly in advance.
      #
      # What is given up, stated plainly: `npm ci` guarantees the
      # installed tree is byte-identical to the lockfile, and `npm
      # install` does not — it may silently pick a newer patch for
      # something the lockfile left loose. For an application with no
      # runtime dependencies beyond React and Next, and whose entire
      # test suite runs on every push, that is a cost worth paying to
      # have deploys that work.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (engines and repositories — Vitest)
        run: npm run test

      - name: Test (frontend — Jest)
        run: npm run test:ui

      - name: Build
        run: npm run build
