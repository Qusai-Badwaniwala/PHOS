<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Return to PHOS</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        align-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px;
        background: #f4f1eb;
        color: #29242a;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 32rem;
        margin: auto;
      }
      img {
        width: 80px;
        height: 80px;
        border-radius: 12px;
      }
      h1 {
        font:
          normal 30px/1.2 Georgia,
          serif;
        letter-spacing: -0.02em;
        margin: 28px 0 16px;
      }
      p {
        color: #68616a;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        margin-top: 20px;
        padding: 8px 22px;
        border-radius: 8px;
        background: #733d4b;
        color: #fff9f2;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 4px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #161418;
          color: #eae4de;
        }
        p {
          color: #b0a5af;
        }
        a {
          background: #d2a2b0;
          color: #21151b;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/icon-192.png" alt="PHOS" />
      <h1>Return to your Hifz.</h1>
      <p>
        This address is not part of the saved PHOS application. Your memorization record stays on
        this device.
      </p>
      <p>
        The installed app includes Today, study, history, exams, settings, and recovery for offline
        use.
      </p>
      <a href="dashboard/">Open Today</a>
    </main>
  </body>
</html>
